<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="apple-mobile-web-app-title" content="dot.">
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
  <title>dot. / Remote Trackpad</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=67">
</head>
<body>
<main class="phone">
  <div class="shell">
    <section class="top">
      <button class="power" id="power" aria-label="Accendi o spegni connessione">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v10M5.6 5.6a9 9 0 1 0 12.8 0"/></svg>
      </button>
      <button class="connection" id="connection">
        <span class="led" id="led"></span>
        <span class="conntexts">
          <strong id="device">MOUSE_PHONE / MAC · v40</strong>
          <small id="statusText">○ CONNECTING</small>
        </span>
        <span class="chevron" id="chevron" aria-label="Apri pannello">⌄</span>
      </button>
    </section>

    <div class="brand">
      <span class="name">dot.</span>
      <button class="dash" id="dash" aria-label="Apri Cinema">
        <svg class="grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="7" height="7" rx="1.5"/>
          <rect x="13" y="4" width="7" height="7" rx="1.5"/>
          <rect x="4" y="13" width="7" height="7" rx="1.5"/>
          <rect x="13" y="13" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
    </div>

    <div class="trackpad" id="trackpad" aria-label="Area gesture per muovere il cursore">
      <canvas class="dotcanvas" id="dotcanvas" aria-hidden="true"></canvas>
      <div class="hint">SWIPE TO MOVE · TAP TO CLICK</div>
    </div>

    <section class="lower">
      <div class="sensrow">
        <label for="sensitivity">SENSITIVITY</label>
        <span class="value" id="sensitivityValue">50%</span>
      </div>
      <div class="sliderrow">
        <span>−</span>
        <input class="slider" id="sensitivity" type="range" min="1" max="100" value="50" aria-label="Sensibilità cursore">
        <span>＋</span>
      </div>
      <div class="footer">
        <div class="footnote" id="footnote">
          <strong>01 / INPUT</strong><br>
          ONE FINGER / MOVE<br>
          TAP / CLICK · HOLD / RIGHT · TWO / SCROLL
        </div>
        <div class="home-mini" id="homeMini" hidden>
          <div class="home-mini-art" id="homeMiniArt"></div>
          <div class="home-mini-text">
            <div class="home-mini-title" id="homeMiniTitle"></div>
            <div class="home-mini-sub" id="homeMiniSub"></div>
          </div>
          <div class="home-mini-ctrls">
            <button class="hm-btn" id="homeMiniPrev" type="button" aria-label="Precedente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14"/><path d="M20 5v14l-12-7z" fill="currentColor"/></svg>
            </button>
            <button class="hm-btn hm-play" id="homeMiniPlay" type="button" aria-label="Play / Pausa"></button>
            <button class="hm-btn" id="homeMiniNext" type="button" aria-label="Successivo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14"/><path d="M4 5v14l12-7z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <button class="calibrate" id="calibrate" title="Ricalibra il puntatore" aria-label="Ricalibra il cursore">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="7" stroke-dasharray="5 3"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6"/></svg>
        </button>
      </div>
    </section>
  </div>

  <section class="cinema" id="cinema" aria-hidden="true">
    <header class="cine-head">
      <button class="cine-back" id="cineBack" aria-label="Torna al trackpad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="cine-title">
        <span class="name">dot.</span>
        <span class="cine-mode">/ CINEMA</span>
      </div>
      <button class="cine-icon-btn" id="cineCast" aria-label="Invia link al Mac">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
      </button>
      <button class="cine-icon-btn" id="cineSettings" aria-label="Impostazioni Cinema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.5.9 1 1.09H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="cine-body" id="cineBody"></div>

    <div class="np-mini" id="npMini">
      <div class="np-mini-art" id="npMiniArt"></div>
      <div class="np-mini-text">
        <div class="np-mini-title" id="npMiniTitle">—</div>
        <div class="np-mini-sub" id="npMiniSub"></div>
      </div>
      <button class="np-mini-play" id="npMiniPlay" aria-label="Play / Pausa"></button>
    </div>

    <div class="castmodal" id="castModal" aria-hidden="true">
      <div class="castmodal-card" id="castModalCard" role="dialog" aria-label="Invia link al Mac"></div>
    </div>

    <div class="cinesheet" id="cineSheet" aria-hidden="true">
      <div class="cinesheet-card" id="cineSheetCard"></div>
    </div>
  </section>

  <div class="np-full" id="npFull" aria-hidden="true">
    <div class="np-full-top">
      <button class="np-full-down" id="npFullDown" aria-label="Chiudi player">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="np-full-actions">
        <button class="np-full-queue" id="npFullQueue" aria-label="Coda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M18 11l4 2.5-4 2.5z"/></svg>
        </button>
        <div class="np-vol-anchor">
          <button class="np-full-audio" id="npFullAudio" aria-label="Volume">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
          <div class="np-vol" id="npVol" aria-hidden="true">
            <div class="np-vol-track" id="npVolTrack">
              <div class="np-vol-fill" id="npVolFill"></div>
              <div class="np-vol-thumb" id="npVolThumb"></div>
            </div>
            <div class="np-vol-val" id="npVolVal">—</div>
          </div>
        </div>
      </div>
    </div>
    <div class="np-coverflow solo" id="npCoverflow">
      <div class="np-coverflow-track" id="npCoverflowTrack"></div>
    </div>
    <div class="np-full-info">
      <div class="np-full-title" id="npFullTitle">—</div>
      <div class="np-full-site" id="npFullSite"></div>
      <button class="np-preview-play" id="npPreviewPlay" type="button" hidden aria-label="Riproduci ora">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l12 7-12 7z"/></svg>
        <span>RIPRODUCI</span>
      </button>
    </div>
    <div class="np-queue" id="npQueue" hidden>
      <div class="np-queue-head">CONTINUE PLAYING</div>
      <div class="np-queue-list" id="npQueueList"></div>
    </div>
    <div class="np-full-spacer"></div>
    <div class="np-full-toggles">
      <button class="np-toggle" id="npFullAuto" type="button" aria-label="Riproduzione automatica della coda" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button class="np-toggle np-toggle-skip" id="npFullSkip" type="button" aria-label="Salta annunci in automatico" aria-pressed="false">
        <span>SKIP</span>
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 5v14l8-7z"/><path d="M13 5v14l8-7z"/></svg>
      </button>
    </div>
    <div class="np-full-scrub" id="npScrub">
      <div class="np-seek-bubble" id="npSeekBubble">0:00</div>
      <div class="np-full-track" id="npFullTrack">
        <div class="np-full-rail"><div class="np-full-fill" id="npFullFill"></div></div>
        <div class="np-full-thumb" id="npFullThumb"></div>
      </div>
    </div>
    <div class="np-full-times"><span id="npFullCur">0:00</span><span id="npFullDur">0:00</span></div>
    <div class="np-full-controls">
      <button class="np-seek" id="npBack" type="button" aria-label="Indietro 5 secondi">
        <span class="np-seek-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4.5V9h4.5"/></svg><b>5</b></span>
      </button>
      <button class="np-ctl np-ctl-icon" id="npFullPrev" type="button" aria-label="Precedente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14"/><path d="M20 5v14l-12-7z" fill="currentColor"/></svg>
      </button>
      <button class="np-ctl np-ctl-play" id="npFullPlay" aria-label="Play / Pausa"></button>
      <button class="np-ctl np-ctl-icon" id="npFullNext" type="button" aria-label="Successivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14"/><path d="M4 5v14l12-7z" fill="currentColor"/></svg>
      </button>
      <button class="np-seek" id="npFwd" type="button" aria-label="Avanti 5 secondi">
        <span class="np-seek-ico flip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4.5V9h4.5"/></svg><b>5</b></span>
      </button>
    </div>
    <div class="nq-menu" id="nqMenu" hidden>
      <button class="nq-menu-item" data-act="up" type="button">SPOSTA SU</button>
      <button class="nq-menu-item" data-act="down" type="button">SPOSTA GIÙ</button>
      <button class="nq-menu-item danger" data-act="remove" type="button">ELIMINA</button>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle" id="sheetHandle"></div>

    <section class="sheet-section">
      <div class="sec-head">
        <strong>02 / TEXT</strong>
        <button class="mic" id="mic" title="Dettatura" aria-label="Dettatura vocale">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
        </button>
      </div>
      <div class="textrow">
        <input id="textInput" type="text" placeholder="scrivi sul mac…" autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="sendText" class="send" aria-label="Invia">↵</button>
      </div>
    </section>

    <section class="sheet-section">
      <div class="sec-head"><strong>03 / MEDIA</strong></div>
      <div class="mediagrid">
        <button class="mediabtn" data-media="voldown" aria-label="Volume giù">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 12h5"/></svg>
        </button>
        <button class="mediabtn" data-media="volup" aria-label="Volume su">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
        <button class="mediabtn" data-media="mute" aria-label="Muto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
        </button>
        <button class="mediabtn" data-media="prev" aria-label="Precedente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v12"/><path d="M18 6.5v11L9.5 12z"/></svg>
        </button>
        <button class="mediabtn" data-media="play" aria-label="Play / Pausa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6.5v11L16.5 12z"/><path d="M19 6v12"/></svg>
        </button>
        <button class="mediabtn" data-media="next" aria-label="Successiva">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6v12"/><path d="M6 6.5v11L14.5 12z"/></svg>
        </button>
      </div>
    </section>

    <section class="sheet-section">
      <div class="sec-head"><strong>04 / OPTIONS</strong></div>
      <div class="chips">
        <button class="chip" id="precision">PRECISION</button>
        <button class="chip" id="invX">INVERT X</button>
        <button class="chip" id="invY">INVERT Y</button>
        <button class="chip active" id="missionControl" type="button" aria-pressed="true">SWIPE SU = MISSION CONTROL</button>
      </div>
    </section>
  </div>

  <div class="confirm" id="confirm" role="dialog" aria-modal="true" hidden>
    <div class="confirm-box">
      <div class="confirm-title">CHIUDERE LA TAB?</div>
      <div class="confirm-text">Scuotendo l'iPhone invii &#8984;W al Mac.</div>
      <div class="confirm-actions">
        <button class="confirm-btn cancel" id="confirmCancel">ANNULLA</button>
        <button class="confirm-btn ok" id="confirmOk">CONFERMA</button>
      </div>
    </div>
  </div>

  <div class="ptr" id="ptr" aria-hidden="true">
    <div class="ptr-ring"></div>
    <span class="ptr-label" id="ptrLabel">TRASCINA PER AGGIORNARE</span>
  </div>

  <div class="toast" id="toast">READY</div>
  <div class="diag" id="diag" aria-hidden="true"></div>
</main>
<script>window.__DOT_TOKEN__ = "__PAIR_TOKEN__";</script>
<script src="app.js?v=45"></script>
<script src="cinema.js?v=49"></script>
</body>
</html>
